    <script>
      // Map Styles (CORS & Free Access, No API Key Required)
      const STYLES = {
        positron:
          "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
        voyager: "https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json",
        darkmatter:
          "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",
        satellite: {
          version: 8,
          sources: {
            "esri-imagery": {
              type: "raster",
              tiles: [
                "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
              ],
              tileSize: 256,
            },
          },
          layers: [
            {
              id: "esri-imagery-layer",
              type: "raster",
              source: "esri-imagery",
            },
          ],
        },
      };

      let currentPrecision = 5;
      let currentCoordinates = []; // [[lng, lat], ...]
      let startMarker = null;
      let endMarker = null;
      let currentStyleKey = "voyager";

      // Initialize MapLibre GL
      const map = new maplibregl.Map({
        container: "map",
        style: STYLES.voyager,
        center: [-122.125, 47.655],
        zoom: 12,
        attributionControl: false,
      });
      map.addControl(
        new maplibregl.AttributionControl({ compact: true }),
        "bottom-left",
      );

      // Polyline5 / Polyline6 Decoder
      function decodePolyline(str, precision = 5) {
        if (!str || typeof str !== "string") return [];
        const factor = Math.pow(10, precision);
        let index = 0,
          len = str.length;
        let lat = 0,
          lng = 0;
        const coordinates = [];

        while (index < len) {
          let b,
            shift = 0,
            result = 0;
          do {
            b = str.charCodeAt(index++) - 63;
            result |= (b & 0x1f) << shift;
            shift += 5;
          } while (b >= 0x20 && index < len);
          const dlat = result & 1 ? ~(result >> 1) : result >> 1;
          lat += dlat;

          shift = 0;
          result = 0;
          do {
            b = str.charCodeAt(index++) - 63;
            result |= (b & 0x1f) << shift;
            shift += 5;
          } while (b >= 0x20 && index < len);
          const dlng = result & 1 ? ~(result >> 1) : result >> 1;
          lng += dlng;

          coordinates.push([lng / factor, lat / factor]);
        }
        return coordinates;
      }

      // Great circle distance in KM
      function haversineDistance(c1, c2) {
        const R = 6371; // Earth radius in km
        const dLat = ((c2[1] - c1[1]) * Math.PI) / 180;
        const dLon = ((c2[0] - c1[0]) * Math.PI) / 180;
        const lat1 = (c1[1] * Math.PI) / 180;
        const lat2 = (c2[1] * Math.PI) / 180;
        const a =
          Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.sin(dLon / 2) *
            Math.sin(dLon / 2) *
            Math.cos(lat1) *
            Math.cos(lat2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
      }

      function calculateTotalDistance(coords) {
        let total = 0;
        for (let i = 1; i < coords.length; i++) {
          total += haversineDistance(coords[i - 1], coords[i]);
        }
        return total;
      }

      // Render polyline on map
      function renderRoute(coords) {
        if (!coords || coords.length === 0) return;
        currentCoordinates = coords;

        const geojson = {
          type: "Feature",
          geometry: {
            type: "LineString",
            coordinates: coords,
          },
        };

        if (map.getSource("route-source")) {
          map.getSource("route-source").setData(geojson);
        } else {
          map.addSource("route-source", {
            type: "geojson",
            data: geojson,
          });

          // Apple Maps Route Glow / Casing Layer
          map.addLayer({
            id: "route-casing",
            type: "line",
            source: "route-source",
            layout: {
              "line-join": "round",
              "line-cap": "round",
            },
            paint: {
              "line-color": "#007aff",
              "line-width": 10,
              "line-opacity": 0.3,
            },
          });

          // Apple Maps Route Main Solid Line
          map.addLayer({
            id: "route-line",
            type: "line",
            source: "route-source",
            layout: {
              "line-join": "round",
              "line-cap": "round",
            },
            paint: {
              "line-color": "#007aff",
              "line-width": 5.5,
              "line-opacity": 1.0,
            },
          });
        }

        // Start & End markers
        if (startMarker) startMarker.remove();
        if (endMarker) endMarker.remove();

        const startEl = document.createElement("div");
        startEl.className = "apple-pin start";
        startEl.title = "Start Point";
        startMarker = new maplibregl.Marker({ element: startEl })
          .setLngLat(coords[0])
          .addTo(map);

        const endEl = document.createElement("div");
        endEl.className = "apple-pin end";
        endEl.title = "End Point";
        endMarker = new maplibregl.Marker({ element: endEl })
          .setLngLat(coords[coords.length - 1])
          .addTo(map);

        // Fit map bounds
        fitRouteBounds(coords);

        // Update UI Stats
        updateStats(coords);
      }

      function fitRouteBounds(coords) {
        if (!coords || coords.length === 0) return;
        const bounds = new maplibregl.LngLatBounds();
        coords.forEach((pt) => bounds.extend(pt));
        map.fitBounds(bounds, {
          padding: { top: 60, bottom: 60, left: 460, right: 80 },
          maxZoom: 17,
          duration: 900,
        });
      }

      function updateStats(coords) {
        const statsCard = document.getElementById("statsCard");
        statsCard.style.display = "flex";

        const distKm = calculateTotalDistance(coords);
        const distMi = distKm * 0.621371;
        document.getElementById("statDistance").textContent =
          `${distKm.toFixed(2)} km (${distMi.toFixed(2)} mi)`;
        document.getElementById("statPoints").textContent =
          `${coords.length.toLocaleString()} pts`;

        const startPt = coords[0];
        const endPt = coords[coords.length - 1];
        document.getElementById("statStart").textContent =
          `Start: ${startPt[1].toFixed(5)}, ${startPt[0].toFixed(5)}`;
        document.getElementById("statEnd").textContent =
          `End: ${endPt[1].toFixed(5)}, ${endPt[0].toFixed(5)}`;

        // Populate coordinate inspector table
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";
        const displayCount = Math.min(coords.length, 100);
        for (let i = 0; i < displayCount; i++) {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${i + 1}</td><td>${coords[i][1].toFixed(6)}</td><td>${coords[i][0].toFixed(6)}</td>`;
          tr.addEventListener("click", () => {
            map.flyTo({ center: coords[i], zoom: 16 });
          });
          tbody.appendChild(tr);
        }
        if (coords.length > 100) {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td colspan="3" style="text-align: center; color: var(--text-secondary); font-style: italic;">...and ${coords.length - 100} more points</td>`;
          tbody.appendChild(tr);
        }
      }

      function showToast(msg) {
        const toast = document.getElementById("toast");
        toast.textContent = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2200);
      }

      // UI Event Listeners
      document.getElementById("decodeBtn").addEventListener("click", () => {
        const str = document.getElementById("polyInput").value.trim();
        if (!str) {
          showToast("Please enter a polyline string");
          return;
        }
        const coords = decodePolyline(str, currentPrecision);
        if (!coords || coords.length === 0) {
          showToast("Failed to decode polyline string");
          return;
        }
        renderRoute(coords);
        try {
          history.replaceState(null, "", `#p=${encodeURIComponent(str)}`);
        } catch (e) {}
        showToast(`Decoded ${coords.length} coordinates`);
      });

      // Auto-decode on paste
      document.getElementById("polyInput").addEventListener("paste", () => {
        setTimeout(() => document.getElementById("decodeBtn").click(), 50);
      });

      // Precision Toggle
      document.querySelectorAll(".segmented-option").forEach((opt) => {
        opt.addEventListener("click", function () {
          document
            .querySelectorAll(".segmented-option")
            .forEach((o) => o.classList.remove("active"));
          this.classList.add("active");
          currentPrecision = parseInt(this.getAttribute("data-prec"), 10);
          const str = document.getElementById("polyInput").value.trim();
          if (str) {
            const coords = decodePolyline(str, currentPrecision);
            renderRoute(coords);
          }
        });
      });

      // Clear
      document.getElementById("clearBtn").addEventListener("click", () => {
        document.getElementById("polyInput").value = "";
        document.getElementById("statsCard").style.display = "none";
        if (map.getSource("route-source")) {
          map
            .getSource("route-source")
            .setData({ type: "FeatureCollection", features: [] });
        }
        if (startMarker) startMarker.remove();
        if (endMarker) endMarker.remove();
        currentCoordinates = [];
      });

      // Load Sample Route
      document
        .getElementById("loadSampleBtn")
        .addEventListener("click", async () => {
          try {
            // Try fetching local polyline.txt if available, else load Seattle test sample
            const resp = await fetch("../../polyline.txt");
            if (resp.ok) {
              const txt = await resp.text();
              document.getElementById("polyInput").value = txt.trim();
              document.getElementById("decodeBtn").click();
              return;
            }
          } catch (e) {}
          // Fallback Seattle test route
          const sample =
            "aa}aHf`hhV?A???G?I?K?Q?S?Y?Y?[?Y?Y?W?W?Y?W?m@AY?W?SAY?WAY?[?]?]?]@_@?g@?g@?g@?e@@_@?a@?W?U?SAOAIAA";
          document.getElementById("polyInput").value = sample;
          document.getElementById("decodeBtn").click();
        });

      // Copy GeoJSON
      document
        .getElementById("copyGeojsonBtn")
        .addEventListener("click", () => {
          if (currentCoordinates.length === 0) return;
          const geojson = {
            type: "Feature",
            geometry: {
              type: "LineString",
              coordinates: currentCoordinates,
            },
            properties: {
              precision: currentPrecision,
              pointsCount: currentCoordinates.length,
              lengthKm: calculateTotalDistance(currentCoordinates),
            },
          };
          navigator.clipboard.writeText(JSON.stringify(geojson, null, 2));
          showToast("GeoJSON copied to clipboard");
        });

      // Download GeoJSON
      document
        .getElementById("downloadGeojsonBtn")
        .addEventListener("click", () => {
          if (currentCoordinates.length === 0) return;
          const geojson = {
            type: "Feature",
            geometry: {
              type: "LineString",
              coordinates: currentCoordinates,
            },
          };
          const blob = new Blob([JSON.stringify(geojson, null, 2)], {
            type: "application/json",
          });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `route_polyline${currentPrecision}.geojson`;
          a.click();
          URL.revokeObjectURL(url);
        });

      // Toggle Table Drawer
      document
        .getElementById("toggleTableBtn")
        .addEventListener("click", () => {
          const drawer = document.getElementById("tableDrawer");
          drawer.style.display =
            drawer.style.display === "none" ? "block" : "none";
        });

      // Map Controls
      document
        .getElementById("zoomInBtn")
        .addEventListener("click", () => map.zoomIn());
      document
        .getElementById("zoomOutBtn")
        .addEventListener("click", () => map.zoomOut());
      document
        .getElementById("recenterBtn")
        .addEventListener("click", () => fitRouteBounds(currentCoordinates));

      // Basemap Switcher
      const layerBtn = document.getElementById("layerBtn");
      const basemapMenu = document.getElementById("basemapMenu");
      layerBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        basemapMenu.classList.toggle("open");
      });
      document.addEventListener("click", () =>
        basemapMenu.classList.remove("open"),
      );

      document.querySelectorAll(".basemap-item").forEach((item) => {
        item.addEventListener("click", function () {
          const styleKey = this.getAttribute("data-style");
          document
            .querySelectorAll(".basemap-item")
            .forEach((i) => i.classList.remove("active"));
          this.classList.add("active");
          currentStyleKey = styleKey;
          map.setStyle(STYLES[styleKey]);
          map.once("style.load", () => {
            if (currentCoordinates.length > 0) {
              renderRoute(currentCoordinates);
            }
          });
        });
      });

      // Dark/Light Theme Toggle
      const themeToggleBtn = document.getElementById("themeToggleBtn");
      themeToggleBtn.addEventListener("click", () => {
        const isDark = document.body.getAttribute("data-theme") === "dark";
        if (isDark) {
          document.body.removeAttribute("data-theme");
          document.querySelector('[data-style="voyager"]').click();
        } else {
          document.body.setAttribute("data-theme", "dark");
          document.querySelector('[data-style="darkmatter"]').click();
        }
      });

      // Map style reload handler
      map.on("style.load", () => {
        if (currentCoordinates.length > 0) {
          renderRoute(currentCoordinates);
        }
      });

      function checkUrlParams() {
        const urlParams = new URLSearchParams(window.location.search);
        const hash = window.location.hash.substring(1);
        const poly =
          urlParams.get("polyline") ||
          urlParams.get("p") ||
          (hash.startsWith("p=")
            ? hash.substring(2)
            : hash.length > 5
              ? hash
              : null);
        const prec = urlParams.get("precision") || urlParams.get("prec");
        if (prec) {
          const p = parseInt(prec, 10);
          if (p === 5 || p === 6) {
            const opt = document.querySelector(
              `.segmented-option[data-prec="${p}"]`,
            );
            if (opt) opt.click();
          }
        }
        if (poly) {
          document.getElementById("polyInput").value = decodeURIComponent(poly);
          document.getElementById("decodeBtn").click();
          return true;
        }
        return false;
      }

      // Load URL params or sample automatically on initial view
      map.on("load", () => {
        if (!checkUrlParams()) {
          document.getElementById("loadSampleBtn").click();
        }
      });
    </script>
  </body>
</html>
