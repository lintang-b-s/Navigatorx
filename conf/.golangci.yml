version: "2"

run:
  timeout: 5m
  # Use more CPU cores
  concurrency: 4

linters:
  exclusions:
    rules:
      - path: (^|/)tests/
        linters: [gosec]
        text: "G304"
      - path: (^|/)eval/
        linters: [gosec]
        text: "G304"
  settings:
    errcheck:
      exclude-functions:
        # Files
        - (*os.File).Close
        - (*os.File).Write
        # Generic interfaces
        - (io.Closer).Close
        - (io.ReadCloser).Close # covers response.Body.Close()
        - (io.Writer).Write
        # Network
        - (net.Conn).Close
        # Bufio
        - (*bufio.Scanner).Close
        - (*bufio.Writer).Flush
        # s2 compression
        - (*github.com/klauspost/compress/s2.Writer).Close
        # Stdlib functions
        - fmt.Fprintf
        - io.Copy
        - net/http.ListenAndServe
        - os.Remove
        - (net.Listener).Close
        - (*zip.ReadCloser).Close
    staticcheck:
      checks:
        - "all"
        - "-ST1003"
        - "-ST1020"
    revive:
      enable-default-rules: true
      rules:
        - name: var-naming
          arguments:
            - ["ID", "IDS"]
            - []

    gosec:
      excludes:
        - G115
        - G404

  enable:
    - errcheck
    - staticcheck
    - govet
    - bodyclose
    - unused
    - gocritic
    - revive
    - gosec
    - dupl
    - goconst

  disable:
    - ineffassign
