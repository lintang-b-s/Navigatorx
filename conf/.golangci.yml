version: "2"

run:
  timeout: 5m
  # Use more CPU cores
  concurrency: 4

linters:
  exclusions:
    paths:
      - pkg/mobile
      - eval
      - tests
  settings:
    errcheck:
      exclude-functions:
        # Files
        - (*os.File).Close
        - (*os.File).Write
        # Generic interfaces
        - (io.Closer).Close
        - (io.ReadCloser).Close # covers response.Body.Close()
        - (io.Writer).Write
        # Network
        - (net.Conn).Close
        # Bufio
        - (*bufio.Scanner).Close
        - (*bufio.Writer).Flush
        # s2 compression
        - (*github.com/klauspost/compress/s2.Writer).Close
        # Stdlib functions
        - fmt.Fprintf
        - io.Copy
        - net/http.ListenAndServe
        - os.Remove
        - (net.Listener).Close
        - (*zip.ReadCloser).Close
    staticcheck:
      checks:
        - "all"
        - "-ST1003"
        - "-ST1020"
    revive: # todo: suruh ai agent buat benerin revive linter issues (hilangin settings revive: ini)
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: indent-error-flow
        - name: superfluous-else
        - name: redefines-builtin-id
        - name: unreachable-code
        - name: time-naming
        - name: var-declaration
        - name: waitgroup-by-value
        - name: receiver-naming
        - name: bool-literal-in-expr
        - name: constant-logical-expr
        - name: empty-block
    gosec:
      excludes:
        - G115
        - G404

  enable:
    - errcheck
    - staticcheck
    - govet
    - bodyclose
    - unused
    - gocritic
    - revive
    - gosec
    - dupl
    - goconst

  disable:
    - ineffassign
